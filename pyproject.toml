[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phystok-research"
version = "0.1.0"
description = "Schema-organized city forecasting and population-frozen evaluation"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "torch>=2.7,<2.8", "numpy>=2.2,<2.3", "pandas>=2.2,<2.3",
  "pyarrow>=20,<21", "numcodecs>=0.15,<0.16", "scipy>=1.15,<1.16",
  "einops>=0.8,<0.9", "scikit-learn>=1.6,<1.7"
]

[project.optional-dependencies]
data = ["xarray>=2025.6", "dask[array]", "zarr>=2.18,<3", "netCDF4>=1.7", "cfgrib", "eccodes", "cdsapi>=0.7.7", "tqdm"]
test = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
include = ["phystok*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
